
name: SMART TRADER Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -o SMART_TRADER_Android_Project_0.4.0.zip -d .
          test -f SmartTraderAndroid/app/build.gradle.kts

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("SmartTraderAndroid/app/build.gradle.kts")
          content = path.read_text(encoding="utf-8")

          marker = "android {"

          if marker not in content:
              raise SystemExit("ERROR: android block not found")

          if "sourceCompatibility = JavaVersion.VERSION_17" not in content:
              addition = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              content = content.replace(marker, addition, 1)

          path.write_text(content, encoding="utf-8")
          print("Java and Kotlin targets configured for JVM 17")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run tests and build APK
        working-directory: SmartTraderAndroid
        run: |
          gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-TRADER-APK
          path: SmartTraderAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
